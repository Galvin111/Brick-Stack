<!DOCTYPE html>
<html lang="en">
<head>

<title>brick club: open play queue</title>
<link rel="icon" href="../assets/brand/favicon.svg" type="image/svg+xml">

<body>
<header class="top">

    <span class="brand"><img src="../assets/brand/mark.svg" alt="" width="43" height="30"><span>brick club</span></span>
    <small class="role">Organizer</small>
  </div>
  <nav aria-label="Sections">
    <a href="#courts"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16M3 12h18"/></svg>Courts</a>
    <a href="#players"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>Players</a>

  </nav>

<main id="app"></main>
<dialog id="dlg" aria-labelledby="dlg-title"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script src="../js/vendor/qrcode.js"></script>
