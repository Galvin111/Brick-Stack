<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brick Club Q: open play queue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EFE6; --surface:#FBFCF8; --ink:#12241B; --muted:#56695E; --line:#C9D4C8;
  --court:#2A6A9A; --kitchen:#2F7D5E; --surround:#1E5A45; --net:#0D1F17;
  --ball:#D9F03C; --on-ball:#12241B; --deck:#F3F8C9; --danger:#A8321F;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1813; --surface:#16241D; --ink:#E6EEE8; --muted:#93A69A; --line:#2A3B32;
    --court:#245C87; --kitchen:#28694F; --surround:#17463A; --net:#07110C;
    --deck:#2A3318; --danger:#F08A76;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1813; --surface:#16241D; --ink:#E6EEE8; --muted:#93A69A; --line:#2A3B32;
  --court:#245C87; --kitchen:#28694F; --surround:#17463A; --net:#07110C;
  --deck:#2A3318; --danger:#F08A76;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;letter-spacing:-.01em}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--court);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:24px}
.mark{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.mark i{width:18px;height:18px;border-radius:50%;background:var(--ball);border:2px solid var(--ink);display:block}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav a{flex:1;text-align:center;padding:14px 4px 12px;text-decoration:none;color:var(--muted);font-weight:600;font-size:.9rem;border-top:3px solid transparent;margin-top:-1px}
nav a[aria-current="page"]{color:var(--ink);border-top-color:var(--ink)}
main{max-width:1120px;margin:0 auto;padding:20px 16px 110px}
@media (min-width:760px){
  nav{position:static;background:none;border:0;padding:0;gap:4px;flex:none}
  nav a{flex:none;padding:8px 14px;border-top:0;border-radius:999px;margin:0;font-size:1rem}
  nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
  main{padding-bottom:48px}
}

.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1.5px solid var(--ink);background:transparent;font-weight:650;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.primary{background:var(--ball);color:var(--on-ball);border-color:var(--on-ball)}
.btn.quiet{border-color:var(--line);font-weight:600}
.btn.small{min-height:36px;padding:0 12px;font-size:.9rem}
.btn.warn{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%}

.summary{color:var(--muted);margin:0 0 16px}
.board{display:grid;gap:28px}
@media (min-width:900px){.board{grid-template-columns:1fr 330px;align-items:start}}
.courts{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.court{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.court-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.court-head h3{font-size:1.25rem;font-weight:700}
.court-head span{color:var(--muted);font-size:.9rem}
.apron{background:var(--surround);padding:9px;border-radius:8px}
.surface{position:relative;display:grid;grid-template-columns:1fr 1fr;min-height:118px;border:2px solid #fff;
  background:
    linear-gradient(90deg,transparent calc(50% - 2px),var(--net) 0 calc(50% + 2px),transparent 0),
    linear-gradient(90deg,transparent calc(34% - 2px),#fff 0 34%,transparent 0 66%,#fff 0 calc(66% + 2px),transparent 0),
    linear-gradient(90deg,var(--court) 34%,var(--kitchen) 0 66%,var(--court) 0)}
.side{display:flex;flex-direction:column;justify-content:center;gap:4px;padding:8px 10px;min-width:0;color:#fff;font-weight:650;font-size:1.02rem}
.side span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side:last-child{text-align:right}
.side.wait{font-weight:500;font-size:.9rem;opacity:.9}
.surface.open{opacity:.6}
.open-tag{position:absolute;inset:0;display:grid;place-items:center}
.open-tag b{background:var(--surface);color:var(--ink);padding:4px 12px;border-radius:999px;font-weight:650;font-size:.9rem}
.court-actions{display:flex;gap:8px;margin-top:10px}
.court-actions .btn{flex:1}
.note{color:var(--muted);font-size:.9rem;margin:10px 0 0}

.queue h2,.panel h2{font-size:1.35rem;font-weight:700}
.queue-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.queue-head span{color:var(--muted);font-size:.9rem}
ol.q{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
ol.q li{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px;border-bottom:1px solid var(--line)}
ol.q li:last-child{border-bottom:0}
ol.q li.deck{background:var(--deck)}
.pos{font-family:var(--display);font-weight:700;width:1.6em;color:var(--muted);font-variant-numeric:tabular-nums}
.who{flex:1;min-width:0}
.who b{display:block;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{color:var(--muted);font-size:.85rem}
.deck-label{font-size:.85rem;font-weight:650;margin:0 0 6px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.panel h2{margin-bottom:12px}
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);padding:0 12px}
.hint{color:var(--muted);font-size:.9rem;margin:8px 0 0}
ul.roster{list-style:none;margin:0;padding:0}
ul.roster li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
ul.roster li:last-child{border-bottom:0}
.empty{text-align:center;padding:40px 16px;max-width:30rem;margin:0 auto}
.empty h1{font-size:clamp(2rem,8vw,3rem);font-weight:800;letter-spacing:-.03em;margin-bottom:12px}
.empty p{color:var(--muted);margin:0 0 20px}
.empty .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:9px 8px;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);font-size:.9rem}
th:nth-child(2),td:nth-child(2){text-align:left;width:60%}
th:first-child,td:first-child{text-align:left;width:2em}
td:nth-child(2){font-weight:650}
tr:last-child td{border-bottom:0}
ul.games{list-style:none;margin:0;padding:0}
ul.games li{padding:8px 0;border-bottom:1px solid var(--line)}
ul.games li:last-child{border-bottom:0}
ul.games small{color:var(--muted)}

.setting{padding:14px 0;border-bottom:1px solid var(--line)}
.setting:first-of-type{padding-top:0}
.setting:last-child{border-bottom:0;padding-bottom:0}
.setting h3{font-family:var(--body);font-size:1rem;font-weight:650;margin-bottom:4px;letter-spacing:0}
.setting p{color:var(--muted);font-size:.9rem;margin:0 0 10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg .btn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper b{font-family:var(--display);font-size:1.5rem;min-width:1.5em;text-align:center}

dialog{border:0;border-radius:16px;background:var(--surface);color:var(--ink);padding:20px;width:min(92vw,26rem)}
dialog::backdrop{background:rgba(8,20,14,.6)}
dialog h2{font-size:1.4rem;font-weight:700;margin-bottom:14px}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.team{border:2px solid var(--line);border-radius:12px;padding:12px 10px;background:transparent;cursor:pointer;text-align:center;font-weight:650;min-height:76px}
.team span{display:block}
.team[aria-pressed="true"]{border-color:var(--on-ball);background:var(--ball);color:var(--on-ball)}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.scores input{width:100%;min-height:44px;text-align:center;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);font-size:1.1rem}
.err{color:var(--danger);font-size:.9rem;min-height:1.3em;margin:4px 0 8px}
.dlg-actions{display:grid;gap:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw;text-align:center}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="mark"><i></i>Brick Club Q</div>
    <nav aria-label="Sections">
      <a href="#courts">Courts</a>
      <a href="#players">Players</a>
      <a href="#standings">Standings</a>
      <a href="#setup">Setup</a>
    </nav>
  </div>
</header>
<main id="app"></main>
<dialog id="dlg" aria-labelledby="dlg-title"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
var KEY='nextup-session-v1';
var VIEWS=['courts','players','standings','setup'];
var SAMPLE=['Maya','Dario','Priya','Tomás','Lena','Kofi','Jun','Farah','Beck','Noor'];
function fresh(){return{players:[],queue:[],courts:[{id:1,game:null,hold:[]},{id:2,game:null,hold:[]}],history:[],settings:{size:4,rotation:'off',partners:'order',auto:false},nextId:1};}
function load(){try{var r=localStorage.getItem(KEY);if(r){var s=JSON.parse(r);if(s&&Array.isArray(s.players)&&Array.isArray(s.courts)&&s.settings)return s;}}catch(e){}return fresh();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var S=load(), app=document.getElementById('app'), dlg=document.getElementById('dlg'), toastEl=document.getElementById('toast');
var dstate=null, armed=null, toastT=null, focusAdd=false;

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function P(id){for(var i=0;i<S.players.length;i++)if(S.players[i].id===id)return S.players[i];return null;}
function nm(id){var p=P(id);return p?p.name:'?';}
function C(id){for(var i=0;i<S.courts.length;i++)if(S.courts[i].id===id)return S.courts[i];return null;}
function ago(t){var m=Math.floor((Date.now()-t)/60000);return m<1?'just now':m+' min';}
function plural(n,w){return n+' '+w+(n===1?'':'s');}
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){toastEl.classList.remove('on');},2600);}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function view(){var h=location.hash.replace('#','');return VIEWS.indexOf(h)>=0?h:'courts';}

/* ---------- session logic ---------- */
function addPlayers(text){
  var names=text.split(/[,\n]/).map(function(s){return s.trim().slice(0,30);}).filter(Boolean), added=0, dup=0;
  names.forEach(function(n){
    var exists=S.players.some(function(p){return p.name.toLowerCase()===n.toLowerCase();});
    if(exists){dup++;return;}
    var id=S.nextId++;
    S.players.push({id:id,name:n,status:'queue',games:0,wins:0,since:Date.now(),run:0});
    S.queue.push(id);added++;
  });
  if(added)toast(plural(added,'player')+' added to the queue'+(dup?', '+dup+' already here':''));
  else if(dup)toast('That name is already in this session');
  autoFill();
}
function toQueue(ids,front){
  ids.forEach(function(id){var p=P(id);if(p){p.status='queue';p.since=Date.now();p.run=0;}});
  if(front)S.queue=ids.concat(S.queue);else S.queue=S.queue.concat(ids);
}
function fillCourt(c){
  var size=S.settings.size, need=size-c.hold.length;
  if(c.game||need<0||S.queue.length<need)return false;
  var take=S.queue.splice(0,need), a=[], b=[], half=size/2;
  if(c.hold.length){
    c.hold.forEach(function(id,i){(i%2?b:a).push(id);});
    take.forEach(function(id){(a.length<half?a:b).push(id);});
  }else{
    if(S.settings.partners==='shuffle')shuffle(take);
    a=take.slice(0,half);b=take.slice(half);
  }
  a.concat(b).forEach(function(id){P(id).status='court';});
  c.game={a:a,b:b,start:Date.now()};c.hold=[];
  return true;
}
function autoFill(){if(S.settings.auto)S.courts.forEach(function(c){if(!c.game)fillCourt(c);});}
function finish(c,winner,sa,sb){
  var g=c.game, win=g[winner], lose=g[winner==='a'?'b':'a'];
  g.a.concat(g.b).forEach(function(id){P(id).games++;});
  win.forEach(function(id){P(id).wins++;});
  S.history.unshift({court:c.id,a:g.a.map(nm),b:g.b.map(nm),sa:sa,sb:sb,winner:winner,at:Date.now()});
  if(S.history.length>200)S.history.length=200;
  c.game=null;
  if(S.settings.rotation==='stay'){
    var stay=[],off=[];
    win.forEach(function(id){var p=P(id);p.run=(p.run||0)+1;(p.run>=2?off:stay).push(id);});
    stay.forEach(function(id){P(id).status='hold';});
    c.hold=stay;
    toQueue(off.concat(lose),false);
  }else{
    toQueue(win.concat(lose),false);
  }
  autoFill();
}
function cancelGame(c){var g=c.game;c.game=null;toQueue(g.a.concat(g.b),true);}
function releaseHold(c){var h=c.hold;c.hold=[];toQueue(h,true);}

/* ---------- views ---------- */
function courtCard(c){
  var size=S.settings.size, h='<article class="court"><div class="court-head"><h3>Court '+c.id+'</h3>';
  if(c.game){
    h+='<span>Playing <span data-since="'+c.game.start+'">'+ago(c.game.start)+'</span></span></div>';
    h+='<div class="apron"><div class="surface">'+sideHtml(c.game.a)+sideHtml(c.game.b)+'</div></div>';
    h+='<div class="court-actions"><button class="btn primary" data-act="result" data-id="'+c.id+'">Record result</button></div>';
  }else if(c.hold.length){
    var need=size-c.hold.length, short=need-S.queue.length;
    h+='<span>Winners staying</span></div>';
    h+='<div class="apron"><div class="surface">'+sideHtml(c.hold)+'<div class="side wait"><span>Needs '+need+' more</span></div></div></div>';
    h+='<div class="court-actions"><button class="btn primary" data-act="fill" data-id="'+c.id+'"'+(short>0?' disabled':'')+'>Send next '+need+' on</button>';
    h+='<button class="btn quiet" data-act="release" data-id="'+c.id+'">Clear court</button></div>';
    if(short>0)h+='<p class="note">Waiting for '+plural(short,'more player')+' in the queue.</p>';
  }else{
    var miss=size-S.queue.length;
    h+='<span>Open</span></div>';
    h+='<div class="apron"><div class="surface open"><div class="side"></div><div class="side"></div><div class="open-tag"><b>Open court</b></div></div></div>';
    h+='<div class="court-actions"><button class="btn primary" data-act="fill" data-id="'+c.id+'"'+(miss>0?' disabled':'')+'>Send next '+size+' on</button></div>';
    if(miss>0)h+='<p class="note">Waiting for '+plural(miss,'more player')+' in the queue.</p>';
  }
  return h+'</article>';
}
function sideHtml(ids){return '<div class="side">'+ids.map(function(id){return '<span>'+esc(nm(id))+'</span>';}).join('')+'</div>';}
function viewCourts(){
  if(!S.players.length){
    return '<div class="empty"><h1>Nobody’s in the queue yet</h1><p>Add the players who’ve checked in. They join the back of the line and you send the next group on whenever a court opens.</p><div class="row"><a class="btn primary" href="#players">Add players</a><button class="btn" data-act="sample">Try it with 10 sample players</button></div></div>';
  }
  var playing=S.players.filter(function(p){return p.status==='court'||p.status==='hold';}).length;
  var open=S.courts.filter(function(c){return !c.game;})[0];
  var deck=open?S.settings.size-open.hold.length:S.settings.size;
  var h='<p class="summary">'+plural(playing,'player')+' on court, '+S.queue.length+' waiting, '+plural(S.history.length,'game')+' played.</p>';
  h+='<div class="board"><section class="courts" aria-label="Courts">'+S.courts.map(courtCard).join('')+'</section>';
  h+='<section class="queue"><div class="queue-head"><h2>Queue</h2><span>'+S.queue.length+' waiting</span></div>';
  if(!S.queue.length){
    h+='<p class="note">The queue is empty. Players come back here when their game ends.</p>';
  }else{
    if(S.queue.length>=deck)h+='<p class="deck-label">The highlighted '+deck+' go on next.</p>';
    h+='<ol class="q">'+S.queue.map(function(id,i){var p=P(id);
      return '<li class="'+(i<deck&&S.queue.length>=deck?'deck':'')+'"><span class="pos">'+(i+1)+'</span><div class="who"><b>'+esc(p.name)+'</b><small>Waiting <span data-since="'+p.since+'">'+ago(p.since)+'</span>, '+plural(p.games,'game')+' played</small></div><button class="btn quiet small" data-act="break" data-id="'+id+'" aria-label="Put '+esc(p.name)+' on a break">Break</button></li>';
    }).join('')+'</ol>';
  }
  var breaks=S.players.filter(function(p){return p.status==='break';});
  if(breaks.length)h+='<p class="note">On a break: '+breaks.map(function(p){return esc(p.name);}).join(', ')+'. Bring them back from Players.</p>';
  return h+'</section></div>';
}
function statusText(p){
  if(p.status==='court'||p.status==='hold'){var c=S.courts.filter(function(c){return (c.game&&c.game.a.concat(c.game.b).indexOf(p.id)>=0)||c.hold.indexOf(p.id)>=0;})[0];return 'On Court '+(c?c.id:'');}
  if(p.status==='break')return 'On a break';
  return 'Number '+(S.queue.indexOf(p.id)+1)+' in the queue';
}
function viewPlayers(){
  var h='<div class="panel"><h2>Add players</h2><div class="add"><input id="add-in" type="text" autocomplete="off" enterkeyhint="done" aria-label="Player names" placeholder="Name, or several separated by commas"><button class="btn primary" data-act="add">Add to queue</button></div><p class="hint">New players join the back of the queue.</p></div>';
  h+='<div class="panel"><h2>'+plural(S.players.length,'player')+' in this session</h2>';
  if(!S.players.length)h+='<p class="note" style="margin:0">Nobody has checked in yet. Add the first name above.</p>';
  else h+='<ul class="roster">'+S.players.slice().sort(function(a,b){return a.name.localeCompare(b.name);}).map(function(p){
    var busy=p.status==='court'||p.status==='hold';
    return '<li><div class="who"><b>'+esc(p.name)+'</b><small>'+statusText(p)+'</small></div>'+
      (p.status==='break'?'<button class="btn small" data-act="rejoin" data-id="'+p.id+'">Rejoin queue</button>':'<button class="btn quiet small" data-act="break" data-id="'+p.id+'"'+(busy?' disabled':'')+'>Break</button>')+
      '<button class="btn quiet small warn" data-act="remove" data-id="'+p.id+'"'+(busy?' disabled':'')+'>Remove</button></li>';
  }).join('')+'</ul>';
  return h+'</div>';
}
function viewStandings(){
  var ps=S.players.filter(function(p){return p.games>0;}).sort(function(a,b){return b.wins-a.wins||(b.wins/b.games-a.wins/a.games)||a.games-b.games||a.name.localeCompare(b.name);});
  if(!ps.length&&!S.history.length)return '<div class="empty"><h1>No results yet</h1><p>Standings fill in as you record results on the Courts tab.</p><div class="row"><a class="btn primary" href="#courts">Go to courts</a></div></div>';
  var h='<div class="panel"><h2>Standings</h2><div class="scroll"><table><thead><tr><th>#</th><th>Player</th><th>Won</th><th>Played</th><th>Win %</th></tr></thead><tbody>'+
    ps.map(function(p,i){return '<tr><td>'+(i+1)+'</td><td>'+esc(p.name)+'</td><td>'+p.wins+'</td><td>'+p.games+'</td><td>'+Math.round(100*p.wins/p.games)+'</td></tr>';}).join('')+'</tbody></table></div></div>';
  h+='<div class="panel"><h2>Recent games</h2><ul class="games">'+S.history.slice(0,30).map(function(g){
    var w=g.winner==='a'?g.a:g.b, l=g.winner==='a'?g.b:g.a, ws=g.winner==='a'?g.sa:g.sb, ls=g.winner==='a'?g.sb:g.sa;
    var sc=(ws!=null&&ls!=null)?', '+ws+'–'+ls:'';
    return '<li><b>'+esc(w.join(' & '))+'</b> beat '+esc(l.join(' & '))+sc+'<br><small>Court '+g.court+'</small></li>';
  }).join('')+'</ul></div>';
  return h;
}
function seg(key,opts){return '<div class="seg">'+opts.map(function(o){return '<button class="btn small" data-act="set" data-key="'+key+'" data-val="'+o[0]+'" aria-pressed="'+(String(S.settings[key])===String(o[0]))+'">'+o[1]+'</button>';}).join('')+'</div>';}
function viewSetup(){
  var last=S.courts[S.courts.length-1], canRemove=S.courts.length>1&&!last.game&&!last.hold.length;
  var h='<div class="panel"><h2>Session setup</h2>';
  h+='<div class="setting"><h3>Courts</h3><p>'+(S.courts.length>1&&!canRemove?'Court '+last.id+' is in use. Finish its game to remove it.':'How many courts you have for this session.')+'</p><div class="stepper"><button class="btn" data-act="court-less" aria-label="Remove a court"'+(canRemove?'':' disabled')+'>−</button><b>'+S.courts.length+'</b><button class="btn" data-act="court-more" aria-label="Add a court"'+(S.courts.length>=12?' disabled':'')+'>+</button></div></div>';
  h+='<div class="setting"><h3>Game type</h3><p>Applies to the next game sent on.</p>'+seg('size',[[4,'Doubles'],[2,'Singles']])+'</div>';
  h+='<div class="setting"><h3>When a game ends</h3><p>Everyone off sends all players to the back of the queue, winners first. Winners stay keeps them on court, split onto opposite sides, for up to two wins in a row.</p>'+seg('rotation',[['off','Everyone off'],['stay','Winners stay']])+'</div>';
  h+='<div class="setting"><h3>Partners</h3><p>Queue order pairs players as they stand in line. Shuffle mixes each group of four at random.</p>'+seg('partners',[['order','Queue order'],['shuffle','Shuffle']])+'</div>';
  h+='<div class="setting"><h3>Fill open courts automatically</h3><p>Sends the next group on as soon as a result is recorded.</p>'+seg('auto',[[false,'Off'],[true,'On']])+'</div>';
  h+='</div><div class="panel"><h2>Start over</h2><div class="setting"><h3>New session, same players</h3><p>Clears results and puts everyone back in the queue.</p><button class="btn" data-act="restart">Start new session</button></div><div class="setting"><h3>Clear everything</h3><p>Removes all players, results and settings from this device.</p><button class="btn warn" data-act="wipe">Clear everything</button></div></div>';
  return h;
}
function render(){
  var v=view();
  document.querySelectorAll('nav a').forEach(function(a){if(a.getAttribute('href')==='#'+v)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  app.innerHTML=({courts:viewCourts,players:viewPlayers,standings:viewStandings,setup:viewSetup})[v]();
  armed=null;
  if(focusAdd){var i=document.getElementById('add-in');if(i)i.focus();focusAdd=false;}
}

/* ---------- result dialog ---------- */
function openResult(c){
  dstate={court:c.id,winner:null};
  var g=c.game;
  function t(side,ids){return '<button type="button" class="team" data-team="'+side+'" aria-pressed="false">'+ids.map(function(id){return '<span>'+esc(nm(id))+'</span>';}).join('')+'</button>';}
  dlg.innerHTML='<h2 id="dlg-title">Who won on Court '+c.id+'?</h2><div class="pick">'+t('a',g.a)+t('b',g.b)+'</div>'+
    '<div class="scores"><input id="sa" type="number" inputmode="numeric" min="0" max="99" placeholder="Score" aria-label="Score for the first team"><input id="sb" type="number" inputmode="numeric" min="0" max="99" placeholder="Score" aria-label="Score for the second team"></div>'+
    '<p class="err" id="dlg-err" role="alert"></p><div class="dlg-actions"><button type="button" class="btn primary" id="dlg-save" disabled>Save result</button><button type="button" class="btn quiet" id="dlg-cancel-game">Cancel this game without a result</button><button type="button" class="btn quiet" id="dlg-back">Back</button></div>';
  dlg.showModal();
}
function setWinner(w){
  dstate.winner=w;
  dlg.querySelectorAll('.team').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.team===w));});
  document.getElementById('dlg-save').disabled=!w;
  document.getElementById('dlg-err').textContent='';
}
function readScore(id){var v=document.getElementById(id).value.trim();if(v==='')return null;var n=parseInt(v,10);return isNaN(n)||n<0?null:n;}
dlg.addEventListener('input',function(){
  var a=readScore('sa'),b=readScore('sb');
  if(a!=null&&b!=null&&a!==b)setWinner(a>b?'a':'b');
});
dlg.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t||!dstate)return;
  var c=C(dstate.court);
  if(t.classList.contains('team'))return setWinner(t.dataset.team);
  if(t.id==='dlg-back'){dlg.close();return;}
  if(!c||!c.game){dlg.close();render();return;}
  if(t.id==='dlg-cancel-game'){cancelGame(c);dlg.close();save();render();toast('Game cancelled. Players are back at the front of the queue');return;}
  if(t.id==='dlg-save'){
    var a=readScore('sa'),b=readScore('sb'),w=dstate.winner,err=document.getElementById('dlg-err');
    if((a==null)!==(b==null)){err.textContent='Enter both scores, or leave both empty.';return;}
    if(a!=null){
      if(a===b){err.textContent='The scores are tied. Change a score to save.';return;}
      if((a>b?'a':'b')!==w){err.textContent='The score says the other side won. Change the score or the winner.';return;}
    }
    finish(c,w,a,b);dlg.close();save();render();toast('Result saved for Court '+c.id);
  }
});
dlg.addEventListener('close',function(){dstate=null;});

/* ---------- actions ---------- */
function confirmTwice(btn,act){
  if(armed===act)return true;
  armed=act;btn.dataset.label=btn.textContent;btn.textContent='Tap again to confirm';
  setTimeout(function(){if(armed===act){armed=null;if(btn.isConnected)btn.textContent=btn.dataset.label;}},4000);
  return false;
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  var act=b.dataset.act,id=parseInt(b.dataset.id,10),p,c,i;
  switch(act){
    case 'sample':addPlayers(SAMPLE.join(','));break;
    case 'add':i=document.getElementById('add-in');if(!i.value.trim()){i.focus();return;}addPlayers(i.value);focusAdd=true;break;
    case 'fill':c=C(id);if(c&&!fillCourt(c))toast('Not enough players in the queue');break;
    case 'result':c=C(id);if(c&&c.game)openResult(c);return;
    case 'release':c=C(id);if(c)releaseHold(c);break;
    case 'break':p=P(id);if(p&&p.status==='queue'){S.queue=S.queue.filter(function(x){return x!==id;});p.status='break';toast(p.name+' is on a break');}break;
    case 'rejoin':p=P(id);if(p&&p.status==='break'){toQueue([id],false);toast(p.name+' is back in the queue');autoFill();}break;
    case 'remove':p=P(id);if(!p||p.status==='court'||p.status==='hold')return;if(!confirmTwice(b,'remove'+id))return;
      S.queue=S.queue.filter(function(x){return x!==id;});S.players=S.players.filter(function(x){return x.id!==id;});toast(p.name+' removed');break;
    case 'set':var k=b.dataset.key,v=b.dataset.val;S.settings[k]=k==='size'?parseInt(v,10):k==='auto'?v==='true':v;autoFill();break;
    case 'court-more':if(S.courts.length<12){S.courts.push({id:S.courts[S.courts.length-1].id+1,game:null,hold:[]});autoFill();}break;
    case 'court-less':c=S.courts[S.courts.length-1];if(S.courts.length>1&&!c.game&&!c.hold.length)S.courts.pop();break;
    case 'restart':if(!confirmTwice(b,'restart'))return;
      S.courts.forEach(function(c){c.game=null;c.hold=[];});S.history=[];S.queue=[];
      S.players.forEach(function(p){p.games=0;p.wins=0;p.run=0;p.status='queue';p.since=Date.now();S.queue.push(p.id);});
      toast('New session started');break;
    case 'wipe':if(!confirmTwice(b,'wipe'))return;S=fresh();toast('Everything cleared');break;
    default:return;
  }
  save();render();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.id==='add-in'&&e.target.value.trim()){addPlayers(e.target.value);focusAdd=true;save();render();}
});
window.addEventListener('hashchange',render);
setInterval(function(){document.querySelectorAll('[data-since]').forEach(function(el){el.textContent=ago(+el.dataset.since);});},15000);
render();
})();
</script>
</body>
</html>
